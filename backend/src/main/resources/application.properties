# ============================================================
# M-DAIRY - Spring Boot Configuration
# ============================================================

server.port=8080
server.servlet.context-path=/

# Database Configuration with environment-variable overrides.
# Default local setup uses H2 so the app runs without a custom MySQL password.
# For production or custom local setups, set DB_URL, DB_USERNAME, DB_PASSWORD, and DB_DRIVER.
spring.datasource.url=${DB_URL:jdbc:h2:mem:m_dairy;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.mdairy=INFO
logging.level.org.springframework.web=INFO
