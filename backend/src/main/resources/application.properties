# ============================================================
# M-DAIRY - Spring Boot Configuration
# ============================================================

server.port=8080
server.servlet.context-path=/

# Database Configuration with Environment Variable overrides
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/m_dairy?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.mdairy=INFO
logging.level.org.springframework.web=INFO
